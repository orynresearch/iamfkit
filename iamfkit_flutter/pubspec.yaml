name: iamfkit
description: >-
  A Flutter FFI plugin for decoding Immersive Audio Model and Formats (IAMF)
  files, powered by the AOMedia libiamf C library. Supports real-time PCM output
  on iOS, Android, macOS, Linux, and Windows.
version: 0.1.0
homepage: https://github.com/MinoDab492/iamfkit

environment:
  sdk: ^3.12.2
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        ffiPlugin: true
      android:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
