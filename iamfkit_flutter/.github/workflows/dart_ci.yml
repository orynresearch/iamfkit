name: Dart & Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Dart Analyze & pub score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        working-directory: eclipsa_iamf_decoder
        run: flutter pub get

      - name: Analyze
        working-directory: eclipsa_iamf_decoder
        run: flutter analyze

      - name: Dry-run publish check
        working-directory: eclipsa_iamf_decoder
        run: dart pub publish --dry-run

      - name: pana score
        working-directory: eclipsa_iamf_decoder
        run: |
          dart pub global activate pana
          pana --no-warning . || true

  test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get dependencies
        working-directory: eclipsa_iamf_decoder
        run: flutter pub get
      - name: Run tests
        working-directory: eclipsa_iamf_decoder
        run: flutter test
