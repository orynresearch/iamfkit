name: Build Native Libraries

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # needed to upload release assets on tags

jobs:
  # ─────────────────────────────────────────────────────────────
  # iOS & macOS — built on macos-latest
  # ─────────────────────────────────────────────────────────────
  build-apple:
    name: Build iOS & macOS XCFrameworks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        run: brew install cmake

      - name: Set libiamf source path
        run: |
          echo "LIBIAMF_SRC=${{ github.workspace }}/code" >> $GITHUB_ENV

      - name: Build iOS XCFramework
        run: bash scripts/build_ios.sh

      - name: Build macOS XCFramework
        run: bash scripts/build_macos.sh

      - name: Package artifacts
        run: |
          (cd ios && zip -r ../iamf-ios.xcframework.zip iamf.xcframework)
          (cd macos && zip -r ../iamf-macos.xcframework.zip iamf_macos.xcframework)

      - uses: actions/upload-artifact@v4
        with:
          name: iamf-ios-xcframework
          path: iamf-ios.xcframework.zip
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: iamf-macos-xcframework
          path: iamf-macos.xcframework.zip
          retention-days: 90

  # ─────────────────────────────────────────────────────────────
  # Android — cross-compiled on ubuntu-latest with NDK
  # ─────────────────────────────────────────────────────────────
  build-android:
    name: Build Android JNI Libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake & Ninja
        run: sudo apt-get install -y cmake ninja-build

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Set libiamf source path
        run: |
          echo "LIBIAMF_SRC=${{ github.workspace }}/code" >> $GITHUB_ENV

      - name: Build Android .so files
        run: bash scripts/build_android.sh

      - name: Package JNI libs
        run: |
          cd android/src/main
          zip -r ../../../iamf-android-jniLibs.zip jniLibs/

      - uses: actions/upload-artifact@v4
        with:
          name: iamf-android-jniLibs
          path: iamf-android-jniLibs.zip
          retention-days: 90

  # ─────────────────────────────────────────────────────────────
  # Linux — built natively on ubuntu-latest
  # ─────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux Shared Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get install -y cmake ninja-build gcc

      - name: Set libiamf source path
        run: |
          echo "LIBIAMF_SRC=${{ github.workspace }}/code" >> $GITHUB_ENV

      - name: Build libiamf.so
        run: bash scripts/build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: iamf-linux-so
          path: linux/libiamf.so
          retention-days: 90

  # ─────────────────────────────────────────────────────────────
  # Windows — built natively on windows-latest
  # ─────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows DLL
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: lukka/get-cmake@latest

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set libiamf source path
        run: |
          echo "LIBIAMF_SRC=${{ github.workspace }}/code" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: Build iamf.dll
        run: scripts\build_windows.bat
        env:
          LIBIAMF_SRC: ${{ github.workspace }}/code

      - name: Package Windows binaries
        run: Compress-Archive -Path windows/iamf.dll, windows/iamf.lib -DestinationPath iamf-windows.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: iamf-windows-dll
          path: iamf-windows.zip
          retention-days: 90

  # ─────────────────────────────────────────────────────────────
  # On a version tag: attach binaries to a GitHub Release.
  # ─────────────────────────────────────────────────────────────
  attach-to-release:
    name: Attach Binaries to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-apple, build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/iamf-ios-xcframework/iamf-ios.xcframework.zip
            release-assets/iamf-macos-xcframework/iamf-macos.xcframework.zip
            release-assets/iamf-android-jniLibs/iamf-android-jniLibs.zip
            release-assets/iamf-linux-so/libiamf.so
            release-assets/iamf-windows-dll/iamf-windows.zip
